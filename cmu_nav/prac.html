<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2D Spiked Wall Line</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background-color: #1a1a1a; /* Dark background para malinaw na makita ang puting linya */
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    /* Container ng Wall Line */
    .spiked-wall {
      position: relative;
      width: 100%;
      max-width: 600px;
      height: 6px;               /* Kapal ng pangunahing linya/pader */
      background-color: #ffffff; /* Puting linya */
    }

    /* Spikes sa ibabaw ng linya */
    .spiked-wall::before {
      content: '';
      position: absolute;
      top: -10px;               /* Taas ng spikes mula sa linya */
      left: 0;
      width: 100%;
      height: 10px;
      /* Gumamit ng repeating linear gradient para sa patusok/triangle spikes */
      background: repeating-linear-gradient(
        45deg,
        #ffffff,
        #ffffff 5px,
        transparent 5px,
        transparent 15px
      );
    }
  </style>
</head>
<body>

  <!-- 2D Straight Wall Line with Spikes -->
  <div class="spiked-wall"></div>

</body>
</html>
